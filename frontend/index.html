<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gsfc-logo-official.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>GSFC University Placement Portal — CampusHire AI Intelligence Platform</title>
    
    <!-- SEO & Social Meta Tags -->
    <meta name="description" content="Official Training & Placement Portal of GSFC University. AI-powered recruitment analytics, live campus drives, aptitude mock simulations, and recruiter-student ecosystem." />
    <meta name="keywords" content="GSFC University, Placement Portal, Campus Placements, Vadodara, Engineering Jobs, TPC Portal, CampusHire AI" />
    <meta name="author" content="GSFC University Training & Placement Cell" />
    
    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gsfcuniversity.ac.in/placement" />
    <meta property="og:title" content="GSFC University Placement Portal — CampusHire AI" />
    <meta property="og:description" content="AI-driven placement intelligence, live corporate recruitment drives, and student skill benchmarks." />
    <meta property="og:image" content="/gsfc-logo-official.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GSFC University Placement Portal — CampusHire AI" />
    <meta name="twitter:description" content="Training & Placement Cell recruitment and student intelligence platform at GSFC University." />
    <meta name="twitter:image" content="/gsfc-logo-official.png" />

    <!-- PWA & Mobile Icons -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GSFC Placements" />
    
    <!-- Cache Control Directives -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Font Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Noto+Serif+Devanagari:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services (Sign in with Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
